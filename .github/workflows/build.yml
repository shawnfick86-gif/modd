name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n 1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/displaytweaks-1.0.0.jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: displaytweaks-jar
          path: out/displaytweaks-1.0.0.jar
